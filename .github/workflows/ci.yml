name: MSGI One CI Verification Gate

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: FastAPI Backend & AI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12 & Dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --dev
      - name: Run Complete Backend Test Suite
        env:
          AI_PROVIDER: deterministic
          ENVIRONMENT: test
        run: uv run pytest tests -q

  mobile-checks:
    name: Expo Mobile Typecheck & Export Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: TypeScript Strict Check
        run: npm run typecheck
      - name: Expo Pre-EAS Bundle Export Verification
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          npx expo export --platform android --output-dir .expo-export-check
          rm -rf .expo-export-check
