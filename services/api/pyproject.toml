[project]
name = "msgi-one-api"
version = "0.1.0"
description = "FastAPI Backend & LangGraph Agent Engine for MSGI One"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "supabase>=2.10.0",
    "pyjwt[crypto]>=2.10.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "google-genai>=1.0.0",
    "pgvector>=0.3.6",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "msgpack>=1.2.4",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "psycopg-binary>=3.3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
